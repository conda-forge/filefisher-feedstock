{% set name = "filefisher" %}
{% set version = "1.3.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/filefisher-{{ version }}.tar.gz
  sha256: fbb05922bf7986ee0834e998e32b3cb9640febc7d50b8e2703bdff61e39e6aca

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm >=7.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - pandas >=2.2
    - parse >=1.20

test:
  imports:
    - filefisher
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/mpytools/filefisher
  summary: find and parse file and folder names
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mathause
    - veni-vidi-vici-dormivi
