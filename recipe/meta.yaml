{% set name = "filefisher" %}
{% set version = "1.4.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/filefisher-{{ version }}.tar.gz
  sha256: c743f3f9f060876724e2277ea4fb4bbf5776d0f1306d331e164866e05a6aea24

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm >=7.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.2
    - pandas >=2.3
    - parse >=1.20

test:
  imports:
    - filefisher
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/mpytools/filefisher
  summary: find and parse file and folder names
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mathause
    - veni-vidi-vici-dormivi
